<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mês • Controlador Financeiro</title>

  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/themes.css" />

  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16x16.png">
  <link rel="manifest" href="./assets/site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
<header class="topbar">
  <div class="brand">
    <strong>Controlador Financeiro</strong>
    <span class="chip">Logado: <span data-user-email>...</span></span>
  </div>
  <nav class="top-actions">
    <a class="btn ghost" href="index.html">Home</a>
    <button class="btn ghost" id="logoutBtn" type="button">Sair</button>
  </nav>
</header>

<div class="shell">
  <main class="content">
    <section class="card month-page">

      <!-- Topo -->
      <div class="month-header">
        <div class="month-title">
          <h1 id="monthTitle">Mês</h1>
          <p class="muted" id="monthSubtitle">Lançamentos do mês selecionado</p>
        </div>

        <div class="month-nav">
          <button class="btn ghost icon" id="prevMonthBtn" type="button" aria-label="Mês anterior">←</button>

          <label class="field mini">
            <span>Mês</span>
            <select id="monthNavSelect"></select>
          </label>

          <label class="field mini">
            <span>Ano</span>
            <select id="yearNavSelect"></select>
          </label>

          <button class="btn ghost icon" id="nextMonthBtn" type="button" aria-label="Próximo mês">→</button>

          <span class="chip" id="saveStatus" data-type="ok">Salvo</span>
        </div>
      </div>

      <!-- Resumo -->
      <div class="month-summary">

        <div class="kpi-grid">
          <div class="kpi">
            <div class="muted">Entradas</div>
            <div class="kpi-value" id="kpiIn">—</div>
          </div>
          <div class="kpi">
            <div class="muted">Saídas</div>
            <div class="kpi-value" id="kpiOut">—</div>
          </div>
          <div class="kpi kpi-strong">
            <div class="muted">Saldo</div>
            <div class="kpi-value" id="kpiBal">—</div>
          </div>
        </div>

        <div class="grid-2 mt">
          <div class="panel">
            <div class="row-between">
              <h2>Incentivo do mês</h2>
              <span class="chip" id="kittyRateChip">—</span>
            </div>

            <div class="kitty">
              <img id="kittyImg" alt="Gatinho de incentivo" />
              <div>
                <div class="kitty-title" id="kittyTitle">—</div>
                <div class="muted" id="kittyHint">—</div>
              </div>
            </div>
          </div>

          <div class="panel">
            <div class="row-between">
              <div>
                <h2>Gráficos</h2>
                <p class="muted small">Distribuição do mês</p>
              </div>
            </div>

            <div class="charts">
              <div class="chart-box">
                <div class="muted small">Entradas</div>
                <canvas id="pieIn"></canvas>
              </div>

              <div class="chart-box">
                <div class="muted small">Saídas</div>
                <canvas id="pieOut"></canvas>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Ações -->
      <div class="grid-2 mt">
        <div class="panel">
          <h2>Novo lançamento</h2>

          <form id="txForm" class="tx-form" novalidate>
            <div class="tx-grid">
              <label class="field">
                <span>Data</span>
                <input id="txDate" type="date" />
              </label>

              <label class="field">
                <span>Tipo</span>
                <select id="txType">
                  <option value="entrada">Entrada</option>
                  <option value="saida">Saída</option>
                </select>
              </label>

              <label class="field">
                <span>Tipo de entrada</span>
                <select id="txIncomeType" disabled>
                  <option value="">—</option>
                </select>
              </label>

              <label class="field">
                <span>Categoria</span>
                <select id="txCategory"></select>
              </label>

              <label class="field">
                <span>Método de pagamento</span>
                <select id="txPayment"></select>
              </label>

              <label class="field">
                <span>Descrição</span>
                <input id="txDesc" type="text" placeholder="Descrição opcional" />
              </label>
            </div>

            <label class="field field-strong">
              <span>Valor</span>
              <input id="txAmount" type="number" step="0.01" min="0.01" placeholder="0,00" required />
            </label>

            <button class="btn primary w-full" type="submit">Adicionar lançamento</button>
          </form>
        </div>

        <div class="panel">
          <div class="row-between">
            <h2>Lançamentos</h2>
            <div class="table-actions">
              <input id="txSearch" class="input-lite" placeholder="Buscar..." />
              <select id="txFilterType" class="input-lite">
                <option value="">Todos</option>
                <option value="entrada">Entradas</option>
                <option value="saida">Saídas</option>
              </select>
            </div>
          </div>

          <div id="txTable" class="table-lite mt"></div>
        </div>
      </div>

    </section>
  </main>
</div>

<footer class="bottom-nav" id="bottomNav">
  <!-- ... seu footer igual ... -->
  <div class="bn-balance" aria-label="Saldo do mês">
    <div class="bn-balance-label">Saldo</div>
    <div class="bn-balance-value" id="footerBalance">—</div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script type="module">
  import { bootstrapProtectedPage } from "./js/app.js";
  import { initMonthPage } from "./js/mes.js";
  import { signOut } from "./js/auth.js";

  await bootstrapProtectedPage();
  await initMonthPage();

  document.querySelector("#logoutBtn")?.addEventListener("click", async () => {
    await signOut();
    window.location.href = "login.html";
  });
</script>
</body>
</html>
